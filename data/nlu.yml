version: "3.1"

nlu:
   - intent: greet
     examples: |
        - hey
        - hello
        - hi
        - hello there
        - good morning
        - good evening
        - moin
        - hey there
        - let's go
        - hey dude
        - goodmorning
        - goodevening
        - good afternoon

   - intent: goodbye
     examples: |
        - cu
        - good by
        - see you later
        - good night
        - bye
        - goodbye
        - have a nice day
        - see you around
        - bye bye

   - intent: affirm
     examples: |
        - yes
        - y
        - indeed
        - of course
        - that sounds good
        - correct

   - intent: deny
     examples: |
        - no
        - n
        - never
        - I don't think so
        - don't like that
        - no way
        - not really

   - intent: mood_great
     examples: |
        - perfect
        - great
        - amazing
        - feeling like a king
        - wonderful
        - I am feeling very good
        - I am great
        - I am amazing
        - I am going to save the world
        - super stoked
        - extremely good
        - so so perfect
        - so good
        - so perfect

   - intent: mood_unhappy
     examples: |
        - my day was horrible
        - I am sad
        - I don't feel very well
        - I am disappointed
        - super sad
        - I'm so sad
        - sad
        - very sad
        - unhappy
        - not good
        - not very good
        - extremly sad
        - so saad
        - so sad

   - intent: bot_challenge
     examples: |
        - are you a bot?
        - are you a human?
        - am I talking to a bot?
        - am I talking to a human?

   - intent: turn_on_light
     examples: |
        - Turn the light on
        - Switch on the light
        - I want to turn on the lights
        - Can you turn on the light?
        - Light on
        - ብርሃን አብራ
        - አብራ ብርሃን

   - intent: turn_off_light
     examples: |
        - Turn the light off
        - Switch off the light
        - I want to turn off the lights
        - Can you turn off the light?
        - Light off
        - ብርሃን አጥፋ
        - አጥፋ ብርሃን

   - intent: check_weather
     examples: |
        - What’s the weather like today?
        - Can you tell me the weather?
        - How is the weather now?
        - Check the weather
        - የአየር ሁኔታ ምንድነው?
        - አየር ሁኔታውን ይምረጡ
